name: Compile and run tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:

    name: ${{ matrix.os }} / stack
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: nix develop --no-update-lock-file --command bash --noprofile --norc -euo pipefail {0}

    steps:

    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        install_url: https://releases.nixos.org/nix/nix-2.32.4/install
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare Nix environment
      id: setup
      run: |
        ghc --version
        stack --numeric-version
        hpc-codecov --version
        printf 'stack-root=%s\n' "$(stack path --stack-root)" >> "$GITHUB_OUTPUT"

    - name: Restore Stack dependencies
      id: stack-deps-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ steps.setup.outputs.stack-root }}/build-plan
          ${{ steps.setup.outputs.stack-root }}/indices
          ${{ steps.setup.outputs.stack-root }}/pantry
          ${{ steps.setup.outputs.stack-root }}/snapshots
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-nix-stack-deps-${{ hashFiles('flake.lock') }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', '*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-nix-stack-deps-${{ hashFiles('flake.lock') }}-

    - name: Install dependencies
      if: steps.stack-deps-cache.outputs.cache-hit != 'true'
      timeout-minutes: 15
      run: |
        stack --lock-file error-on-write build --test --no-run-tests --only-dependencies

    - name: Save Stack dependencies
      if: steps.stack-deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ steps.setup.outputs.stack-root }}/build-plan
          ${{ steps.setup.outputs.stack-root }}/indices
          ${{ steps.setup.outputs.stack-root }}/pantry
          ${{ steps.setup.outputs.stack-root }}/snapshots
        key: ${{ steps.stack-deps-cache.outputs.cache-primary-key }}

    - name: Run tests with coverage
      timeout-minutes: 15
      run: |
        stack --lock-file error-on-write test --coverage --fast

    - name: Build
      timeout-minutes: 15
      run: |
        stack --lock-file error-on-write build --test --no-run-tests

    - name: Generate coverage report
      run: |
        hpc-codecov --verbose --out ./codecov.json stack:advent-of-code2022-reloaded-test

    - name: Send coverage report
      uses: codecov/codecov-action@v6
      with:
        files: ./codecov.json
        fail_ci_if_error: false # optional (default = false)
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
