name: Compile and run tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.18.1.0"

jobs:
  cabal:
    name: ${{ matrix.os }} / cabal
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Setup Haskell
      id: setup
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ env.GHC_VERSION }}
        cabal-version: ${{ env.CABAL_VERSION }}

    - name: Cache Cabal dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-${{ runner.arch }}-cabal-${{ env.CABAL_VERSION }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('cabal.project', 'cabal.project.freeze', '*.cabal') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cabal-${{ env.CABAL_VERSION }}-ghc-${{ env.GHC_VERSION }}-

    - name: Build
      timeout-minutes: 30
      run: cabal build all --enable-coverage

    - name: Run tests with coverage
      timeout-minutes: 15
      run: cabal test all --enable-coverage --test-show-details=direct

    - name: Generate coverage report
      uses: 8c6794b6/hpc-codecov-action@v4
      with:
        target: cabal:advent-of-code2022-reloaded-test
        out: ./codecov.json
        verbose: true

    - name: Send coverage report
      uses: codecov/codecov-action@v6
      with:
        files: ./codecov.json
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
